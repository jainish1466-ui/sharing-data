name: Sharing Data CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t sharing-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t sharing-frontend ./frontend